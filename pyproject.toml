[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prepify-9618"
version = "0.3.0"
description = "Cambridge 9618 preparation, provisional execution grading, and validated exam assembly"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
